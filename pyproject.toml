[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queryguard"
version = "0.1.0"
description = "Web system for detecting resource-intensive PostgreSQL queries in a retail network"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "redis==5.2.1",
  "Jinja2==3.1.5",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "fakeredis==2.26.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.svg", "static/css/*.css", "static/js/*.js"]
